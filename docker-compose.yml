# Narrated Slides: make slides (Presenton), voice them (Kokoro), get a narrated video.
#
#   cp .env.example .env
#   docker compose up -d --build                      # slides + voice + the narrator app
#   docker compose --profile ollama up -d --build     # ...plus a local LLM (Ollama)
#
# Narrator app: http://localhost:8000     Presenton: http://localhost:5001
name: narrated-slides

services:
  narrator:
    build: ./narrator
    image: narrated-slides/narrator:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:${NARRATOR_PORT:-8000}:8000"
    environment:
      # Voice: any OpenAI-compatible /audio/speech endpoint works here
      TTS_BASE_URL: http://kokoro:8880/v1
      TTS_MODEL: kokoro
      TTS_VOICE: ${TTS_VOICE:-af_heart}
      # Second voice engine (Piper) for languages Kokoro lacks; Albanian by default
      EXTRA_TTS_BASE_URL: http://piper:8000/v1
      # Optional: model that writes missing speaker notes (OpenAI-compatible chat API)
      NOTES_LLM_BASE_URL: ${NOTES_LLM_BASE_URL:-http://ollama:11434/v1}
      NOTES_LLM_MODEL: ${NOTES_LLM_MODEL:-llama3.2:3b}
      NOTES_LLM_API_KEY: ${NOTES_LLM_API_KEY:-not-needed}
      # Optional: lets the narrator app generate decks through Presenton's API
      PRESENTON_URL: http://presenton:80
      PRESENTON_PUBLIC_URL: http://localhost:${PRESENTON_PORT:-5001}
      PRESENTON_API_KEY: ${PRESENTON_API_KEY:-}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-100}
      RETENTION_DAYS: ${RETENTION_DAYS:-7}
    volumes:
      - narrator_data:/data
    depends_on:
      - kokoro

  kokoro:
    # CPU build. For an NVIDIA GPU use ghcr.io/remsky/kokoro-fastapi-gpu and the `deploy` block below.
    # Pinned to a tested version by scripts/pin-images.sh. Override with KOKORO_IMAGE in .env.
    image: ${KOKORO_IMAGE:-ghcr.io/remsky/kokoro-fastapi-cpu@sha256:f54c5960c2b9387f6349080a9944f8bc7e8cdb98a4ef9238cb0b0f9ff9795f44}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${KOKORO_PORT:-8880}:8880"
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  piper:
    # Local Piper TTS with an Albanian voice. Downloads the voice (~60 MB) on first start.
    # Add more Piper voices with PIPER_VOICES in .env (name=URL-of-model.onnx, comma separated).
    build: ./piper
    image: narrated-slides/piper:local
    restart: unless-stopped
    environment:
      PIPER_VOICES: ${PIPER_VOICES:-sq_edon=https://huggingface.co/edonseki/folsh.ai/resolve/main/sq_AL-medium.onnx}
    volumes:
      - piper_models:/models

  presenton:
    image: ${PRESENTON_IMAGE:-ghcr.io/presenton/presenton@sha256:dd444e4384df0caeb7cb96a26bfa7543a12d2be19c83d661446b2087d09aed54}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PRESENTON_PORT:-5001}:80"
    volumes:
      - ./data/presenton:/app_data
    # Presenton reads LLM, OLLAMA_URL, OLLAMA_MODEL, OPENAI_API_KEY, IMAGE_PROVIDER ... from .env
    env_file:
      - path: .env
        required: false   # compose still starts if you skipped `cp .env.example .env`
    extra_hosts:
      - "host.docker.internal:host-gateway"

  ollama:
    # Optional local LLM shared by Presenton and the notes writer. Start with: --profile ollama
    profiles: ["ollama"]
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  narrator_data:
  ollama_models:
  piper_models:
