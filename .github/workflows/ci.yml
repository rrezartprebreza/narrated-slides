name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: narrator/requirements-dev.txt
      - name: System packages (same ones the Docker image installs)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg poppler-utils libreoffice-impress fonts-liberation fonts-dejavu-core
      - run: pip install -r narrator/requirements-dev.txt
      - name: Tests
        working-directory: narrator
        run: python -m pytest tests -q
      - name: Cloner service tests (fake model)
        working-directory: cloner
        run: |
          pip install -r requirements.txt
          python -m pytest tests -q
      - name: Piper service tests
        working-directory: piper
        run: |
          pip install -r requirements.txt
          python -m pytest tests -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Compose file is valid
        run: |
          cp .env.example .env
          docker compose config -q
      - name: Images build
        run: |
          docker build -t narrated-slides-narrator ./narrator
          docker build -t narrated-slides-piper ./piper
          docker build -t narrated-slides-cloner ./cloner
